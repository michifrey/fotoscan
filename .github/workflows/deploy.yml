# Bauen und auf GitHub Pages veröffentlichen.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eine Veröffentlichung zur Zeit; eine laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Der Bau braucht keinen Browser; Playwright soll beim Installieren
          # keine 150 MB nachladen. Die Browsertests laufen lokal.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Erst die Modultests, dann bauen: Eine kaputte Bilderkennung soll die
      # bisher veröffentlichte Fassung nicht ersetzen.
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Projektseite: die App liegt unter /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          # Pages beim ersten Lauf selbst einschalten, damit kein Handgriff in
          # den Einstellungen nötig ist.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
